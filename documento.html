<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documento | Genius</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/documento.css">
  <style id="pagina"></style>
  <link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>
  <div class="editor">
    <aside class="panel" id="panel"></aside>
    <section class="mesa">
      <div class="barra">
        <span id="estado" class="mute">Vista previa del documento</span>
        <span class="acc">
          <button class="btn-sec" data-act="guardar">Guardar</button>
          <button class="btn" data-act="pdf">Guardar y descargar PDF</button>
        </span>
      </div>
      <div id="hoja" class="hoja"></div>
    </section>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/datos.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/plantillas.js"></script>
  <script src="js/documento.js"></script>
</body>
</html>
